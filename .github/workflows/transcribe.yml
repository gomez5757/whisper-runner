name: transcribe
on: workflow_dispatch
permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.m.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - id: m
        run: echo "matrix=$(jq -c . jobs.json)" >> "$GITHUB_OUTPUT"

  run:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        include: ${{ fromJson(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q faster-whisper==1.2.1 av==18.1.0
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-large-v3
      - name: descifrar
        env:
          KEY: ${{ secrets.TRANSCRIBE_KEY }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in data/${{ matrix.file }}.bin -out "$RUNNER_TEMP/a.flac"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:KEY -in data/cfg.bin -out "$RUNNER_TEMP/cfg.json"
      - name: transcribir
        run: python transcribe.py "$RUNNER_TEMP/a.flac" "$RUNNER_TEMP/cfg.json" ${{ matrix.start }} ${{ matrix.end }} "$RUNNER_TEMP/out.json"
      - name: cifrar resultado
        env:
          KEY: ${{ secrets.TRANSCRIBE_KEY }}
        run: |
          mkdir -p out
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:KEY -in "$RUNNER_TEMP/out.json" -out out/${{ matrix.id }}.bin
          rm -f "$RUNNER_TEMP/a.flac" "$RUNNER_TEMP/cfg.json" "$RUNNER_TEMP/out.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.id }}
          path: out/${{ matrix.id }}.bin
          retention-days: 3
